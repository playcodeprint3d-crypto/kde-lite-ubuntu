<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Play Code - Laboratorio IA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #060913;
            color: #F8FAFC;
            font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background-image: 
                radial-gradient(circle at 50% 35%, rgba(0, 229, 255, 0.12) 0%, transparent 60%),
                radial-gradient(circle at 50% 70%, rgba(255, 115, 0, 0.10) 0%, transparent 60%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        .top-glow {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #FF7300, #00E5FF, #8B5CF6, #00E5FF, #FF7300);
            background-size: 300% 100%;
            animation: moveGradient 8s linear infinite;
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            100% { background-position: 300% 50%; }
        }

        .card {
            background: rgba(14, 22, 41, 0.85);
            border: 1.5px solid rgba(56, 189, 248, 0.25);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 55px 48px;
            text-align: center;
            max-width: 680px;
            width: 90%;
            box-shadow: 0 25px 60px -15px rgba(0, 229, 255, 0.2), 0 0 0 1px rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 15%;
            right: 15%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #00E5FF, #FF7300, transparent);
        }

        .logo-img {
            width: 92px;
            height: 92px;
            border-radius: 24px;
            object-fit: cover;
            margin-bottom: 26px;
            box-shadow: 0 12px 35px -5px rgba(255, 115, 0, 0.5), 0 0 0 2px rgba(255, 115, 0, 0.35);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .logo-img:hover {
            transform: scale(1.06);
            box-shadow: 0 16px 45px -5px rgba(255, 115, 0, 0.7), 0 0 0 3px rgba(255, 115, 0, 0.6);
        }

        h1 {
            font-size: 36px;
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: -0.025em;
            margin-bottom: 36px;
            background: linear-gradient(135deg, #FFFFFF 30%, #94A3B8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        h1 span {
            background: linear-gradient(90deg, #00E5FF, #38BDF8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
            margin-top: 6px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: linear-gradient(135deg, #00E5FF 0%, #0284C7 100%);
            color: #041026;
            font-size: 18px;
            font-weight: 800;
            padding: 18px 40px;
            border-radius: 16px;
            text-decoration: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 10px 30px -5px rgba(0, 229, 255, 0.5);
            cursor: pointer;
            border: none;
            font-family: inherit;
        }

        .btn-action:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 18px 40px -5px rgba(0, 229, 255, 0.7);
            background: linear-gradient(135deg, #38BDF8 0%, #00E5FF 100%);
            color: #000;
        }

        .btn-action:active {
            transform: translateY(0) scale(0.99);
        }

        .btn-action svg {
            width: 22px;
            height: 22px;
            transition: transform 0.2s ease;
        }

        .btn-action:hover svg {
            transform: translateX(4px);
        }

        footer {
            position: fixed;
            bottom: 24px;
            font-size: 12px;
            color: #64748B;
            font-family: 'JetBrains Mono', monospace;
            text-align: center;
            letter-spacing: 0.05em;
        }
    </style>
</head>
